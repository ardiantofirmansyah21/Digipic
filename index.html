<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Wedding Celebration of Sabrina & Raka</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fcfbf7;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        /* Kontainer Utama Aplikasi (Rasio HP) */
        .app-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            position: relative;
            background-color: #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }

        /* Halaman Utama / Welcome Screen */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            background: #fcfbf7;
            z-index: 10;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            visibility: visible;
            opacity: 1;
        }
        .screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .circle-img {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        .subtitle {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #b56a25;
            margin-bottom: 10px;
        }
        .title {
            font-size: 32px;
            font-family: 'Georgia', serif;
            margin-bottom: 20px;
            color: #2c2c2c;
        }
        .divider {
            width: 80%;
            height: 1px;
            background: linear-gradient(to right, transparent, #b56a25, transparent);
            margin-bottom: 25px;
        }
        .date {
            font-size: 15px;
            color: #666;
            letter-spacing: 1px;
            margin-bottom: 40px;
        }
        .btn-primary {
            background-color: #b56a25;
            color: #fff;
            border: none;
            padding: 15px 35px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(181, 106, 37, 0.3);
            transition: transform 0.2s;
            z-index: 15;
        }
        .btn-primary:active {
            transform: scale(0.95);
        }

        /* Halaman Kamera / Photobooth */
        .photobooth-container {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* FRAME PERNIKAHAN DIGITAL */
        .wedding-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 140px; /* Dinaikkan agar tidak tertutup tombol jepret fisik */
        }

        /* Gambar Kartun Pengantin */
        .frame-bride-groom {
            width: 70px;
            height: auto;
            margin-bottom: -5px;
            z-index: 5;
        }

        /* Kotak Teks Utama */
        .frame-text-box {
            background-color: rgba(22, 22, 22, 0.85);
            color: #fff;
            width: 85%;
            padding: 12px 10px;
            border-radius: 15px;
            text-align: center;
            backdrop-filter: blur(5px);
            z-index: 4;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .frame-stars {
            color: #ffd700;
            font-size: 12px;
            margin: 2px 0;
            letter-spacing: 3px;
        }
        .frame-names {
            font-family: 'Georgia', serif;
            font-size: 22px;
            font-weight: normal;
            color: #ffd700;
            margin: 2px 0;
        }
        .frame-tagline {
            font-size: 9px;
            letter-spacing: 1px;
            color: #ddd;
            text-transform: uppercase;
        }

        /* UI Kontrol: Tombol Jepret & Hitung Mundur */
        .controls {
            position: absolute;
            bottom: 35px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 20;
        }
        .btn-capture {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background-color: #fff;
            border: 6px solid rgba(181, 106, 37, 0.6);
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .btn-capture:active {
            background-color: #ddd;
        }
        .countdown {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 120px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 4px 15px rgba(0,0,0,0.6);
            z-index: 30;
            display: none;
        }

        /* Hasil Preview Foto / Download Screen */
        .preview-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 40;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #resultCanvas {
            max-width: 100%;
            max-height: 70vh;
            border-radius: 12px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.6);
            margin-bottom: 25px;
        }
        .preview-buttons {
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
        }
        .btn-secondary {
            background-color: #555;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div id="welcomeScreen" class="screen">
            <img src="https://images.unsplash.com/photo-1519741497674-611481863552?q=80&w=400" class="circle-img" alt="Wedding">
            <p class="subtitle">The Wedding Celebration of</p>
            <h1 class="title">Sabrina & Raka</h1>
            <div class="divider"></div>
            <p class="date">FRIDAY, 29 MAY 2026</p>
            <button class="btn-primary" id="btnOpenPhotobooth">✨ BUKA PHOTOBOOTH</button>
        </div>

        <div class="photobooth-container">
            <video id="webcam" autoplay playsinline muted></video>

            <div class="wedding-frame">
                <img src="pengantin.png" class="frame-bride-groom" alt="Pengantin">
                <div class="frame-text-box">
                    <div class="frame-stars">✨ ✨</div>
                    <h2 class="frame-names">Sabrina & Raka</h2>
                    <p class="frame-tagline">29.05.2026 — HAPPY EVER AFTER</p>
                    <div class="frame-stars">✨ 👑 ✨</div>
                </div>
            </div>

            <div id="countdown" class="countdown">3</div>

            <div class="controls" id="controlsSection" style="display: none;">
                <button class="btn-capture" id="btnCapture" title="Ambil Foto"></button>
            </div>
        </div>

        <div id="previewScreen" class="preview-screen">
            <canvas id="resultCanvas"></canvas>
            <div class="preview-buttons">
                <button class="btn-secondary" id="btnRetake">Foto Ulang</button>
                <button class="btn-primary" id="btnDownload">💾 Simpan Foto</button>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
