<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Wedding Celebration of Sabrina & Raka</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fcfbf7;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .app-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            position: relative;
            background-color: #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }

        /* Halaman Utama / Welcome Screen */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            background: #fcfbf7;
            z-index: 100;
            transition: opacity 0.3s ease;
        }
        .screen.hidden {
            display: none !important;
        }
        .circle-img {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }
        .subtitle {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #b56a25;
            margin-bottom: 10px;
        }
        .title {
            font-size: 30px;
            font-family: 'Georgia', serif;
            margin-bottom: 15px;
            color: #2c2c2c;
        }
        .divider {
            width: 70%;
            height: 1px;
            background: linear-gradient(to right, transparent, #b56a25, transparent);
            margin-bottom: 20px;
        }
        .date {
            font-size: 14px;
            color: #666;
            margin-bottom: 35px;
        }
        .btn-primary {
            background-color: #b56a25;
            color: #fff;
            border: none;
            padding: 14px 30px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(181, 106, 37, 0.3);
        }

        /* Halaman Kamera / Area Tangkapan Foto */
        .photobooth-area {
            position: relative;
            width: 100%;
            height: 82%; /* Menyisakan ruang bawah untuk tombol jepret agar tidak saling tumpang tindih */
            background-color: #000;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* SUSUNAN OVERLAY FRAME YANG DIJAMIN RAPI */
        .wedding-frame-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 20px;
            pointer-events: none; /* Mencegah pemblokiran klik pada layar */
        }
        .frame-bride-groom {
            width: 85px; /* Ukuran gambar kartun pengantin disesuaikan agar proporsional */
            height: auto;
            margin-bottom: -5px;
            z-index: 5;
        }
        .frame-text-box {
            background-color: rgba(22, 22, 22, 0.88);
            color: #fff;
            width: 88%;
            padding: 15px 10px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            z-index: 4;
        }
        .frame-stars {
            color: #ffd700;
            font-size: 11px;
            letter-spacing: 2px;
            margin: 2px 0;
        }
        .frame-names {
            font-family: 'Georgia', serif;
            font-size: 21px;
            color: #ffd700;
            margin: 3px 0;
        }
        .frame-tagline {
            font-size: 9px;
            letter-spacing: 1px;
            color: #ddd;
            text-transform: uppercase;
        }

        /* Kontrol Bawah */
        .bottom-bar {
            width: 100%;
            height: 18%;
            background-color: #fcfbf7;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }
        .btn-capture {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background-color: #fff;
            border: 6px solid #b56a25;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .countdown {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 100px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 80;
            display: none;
        }

        /* Halaman Preview Hasil */
        .preview-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fcfbf7;
            z-index: 200;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .preview-image-container {
            width: 100%;
            max-height: 75vh;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        #outputImage {
            width: 100%;
            height: auto;
            display: block;
        }
        .preview-buttons {
            display: flex;
            gap: 15px;
            width: 90%;
        }
        .preview-buttons button {
            flex: 1;
            padding: 14px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 15px;
            border: none;
            cursor: pointer;
        }
        .btn-secondary {
            background-color: #e0ded7;
            color: #444;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div id="welcomeScreen" class="screen">
            <img src="https://images.unsplash.com/photo-1519741497674-611481863552?q=80&w=400" class="circle-img" alt="Wedding">
            <p class="subtitle">The Wedding Celebration of</p>
            <h1 class="title">Sabrina & Raka</h1>
            <div class="divider"></div>
            <p class="date">FRIDAY, 29 MAY 2026</p>
            <button class="btn-primary" id="btnOpenPhotobooth">✨ BUKA PHOTOBOOTH</button>
        </div>

        <div class="photobooth-area" id="captureTarget">
            <video id="webcam" autoplay playsinline muted></video>

            <div class="wedding-frame-overlay">
                <img src="pengantin.png" class="frame-bride-groom" alt="Pengantin">
                
                <div class="frame-text-box">
                    <div class="frame-stars">✨ ✨</div>
                    <h2 class="frame-names">Sabrina & Raka</h2>
                    <p class="frame-tagline">29.05.2026 — HAPPY EVER AFTER</p>
                    <div class="frame-stars">✨ 👑 ✨</div>
                </div>
            </div>

            <div id="countdown" class="countdown">3</div>
        </div>

        <div class="bottom-bar">
            <button class="btn-capture" id="btnCapture" id="btnCapture" title="Ambil Foto"></button>
        </div>

        <div id="previewScreen" class="preview-screen">
            <div class="preview-image-container">
                <img id="outputImage" src="" alt="Hasil Foto">
            </div>
            <div class="preview-buttons">
                <button class="btn-secondary" id="btnRetake">Foto Ulang</button>
                <button class="btn-primary" id="btnDownload">💾 Simpan Foto</button>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
