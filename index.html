<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photobooth Kebahagiaan - Sabrina & Raka</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #fcfbf7;
        }
        .font-serif {
            font-family: 'Cinzel', Georgia, serif;
        }
    </style>
</head>
<body class="text-stone-800 antialiased bg-[#fcfbf7]">

    <!-- ========================================== -->
    <!-- HALAMAN UTAMA (HERO SECTION FULL SCREEN)   -->
    <!-- ========================================== -->
    <section class="min-h-screen flex flex-col items-center justify-end pb-20 text-center relative overflow-hidden">
        
        <!-- Wadah Foto Full Background -->
        <div class="absolute inset-0 w-full h-full z-0">
            <!-- Foto Pengantin Full Screen -->
            <img src="https://images.unsplash.com/photo-1519741497674-611481863552?q=80&w=1200&auto=format&fit=crop" 
                 alt="Sabrina & Raka" 
                 class="w-full h-full object-cover">
            
            <!-- Efek Gradasi Opacity Menyambung ke Latar Belakang Bawah & Gelap di Atas untuk Keterbacaan Teks -->
            <div class="absolute inset-0 bg-gradient-to-t from-[#fcfbf7] via-stone-950/40 to-stone-950/20"></div>
        </div>

        <!-- Konten Teks & Tombol di Atas Foto -->
        <div class="relative z-10 px-6 w-full max-w-md drop-shadow-md">
            <p class="text-xs tracking-[0.2em] text-amber-400 uppercase font-bold">The Wedding Celebration of</p>
            <h1 class="text-5xl font-serif text-white font-extrabold mt-3 tracking-wide">Sabrina & Raka</h1>
            
            <div class="flex items-center justify-center gap-3 my-4 w-full max-w-xs mx-auto">
                <div class="h-[1px] bg-amber-400/50 w-full"></div>
                <span class="text-amber-400 text-xs">◆</span>
                <div class="h-[1px] bg-amber-400/50 w-full"></div>
            </div>
            
            <p class="text-sm font-medium tracking-widest text-stone-200 uppercase">Friday, 29 May 2026</p>
            
            <button id="startBoothBtn" class="mt-8 w-full bg-gradient-to-r from-amber-600 to-amber-700 hover:from-amber-700 hover:to-amber-800 text-white font-semibold py-4 rounded-full shadow-2xl text-xs tracking-widest uppercase transition-all transform active:scale-95">
                ✨ Buka Photobooth
            </button>
            
            <a href="#gallery-section" class="mt-5 inline-block text-xs font-medium text-amber-400 hover:text-amber-300 transition-colors tracking-wider">Lihat Galeri Kebahagiaan ➔</a>
        </div>
    </section>

    <!-- ========================================== -->
    <!-- HALAMAN SEKSI GALERI KEBAHAGIAAN          -->
    <!-- ========================================== -->
    <section id="gallery-section" class="py-16 px-4 max-w-4xl mx-auto">
        <div class="text-center mb-10">
            <h2 class="text-3xl font-serif text-stone-900 font-bold">Galeri Kebahagiaan</h2>
            <p class="text-xs text-stone-500 mt-2 tracking-wide">Kumpulan momen indah yang dibagikan oleh para tamu undangan</p>
            <div class="w-12 h-[2px] bg-amber-600 mx-auto mt-4"></div>
        </div>

        <!-- Grid Container untuk Foto-foto Galeri -->
        <div id="galleryGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-4">
            <!-- Item galeri akan dirender secara dinamis melalui JavaScript -->
        </div>
    </section>

    <!-- ========================================== -->
    <!-- MODAL DETAIL GALERI (UNTUK MELIHAT & SHARE)-->
    <!-- ========================================== -->
    <div id="galleryModal" class="fixed inset-0 bg-stone-950/90 z-50 flex flex-col justify-center items-center p-4 hidden">
        <div class="bg-white rounded-2xl overflow-hidden w-full max-w-md shadow-2xl relative flex flex-col">
            
            <!-- Foto di dalam Modal -->
            <div class="relative bg-stone-900 flex items-center justify-center min-h-[300px]">
                <img id="modalImg" src="" alt="Detail Foto" class="w-full h-auto max-h-[70vh] object-contain">
            </div>

            <!-- Kontrol Audio / Musik Latar Momen -->
            <div class="p-4 bg-stone-50 border-b border-stone-100 flex flex-col items-center justify-center">
                <p id="noAudioTxt" class="text-xs text-stone-400 italic hidden">Foto ini tidak memiliki rekaman suara</p>
                <audio id="modalAudio" controls class="w-full max-w-xs mt-1 hidden"></audio>
            </div>

            <!-- Tombol Aksi (Bagikan, Hapus, Tutup) -->
            <div class="p-4 grid grid-cols-3 gap-2 bg-white">
                <button id="modalShareBtn" class="bg-amber-600 hover:bg-amber-700 text-white font-medium py-3 rounded-xl text-xs uppercase tracking-wider transition-colors flex items-center justify-center gap-1">
                    Bagikan
                </button>
                <button id="modalDeleteBtn" class="bg-rose-50 hover:bg-rose-100 text-rose-600 font-medium py-3 rounded-xl text-xs uppercase tracking-wider transition-colors">
                    Hapus
                </button>
                <button id="closeModalBtn" class="bg-stone-200 hover:bg-stone-300 text-stone-700 font-medium py-3 rounded-xl text-xs uppercase tracking-wider transition-colors">
                    Tutup
                </button>
            </div>
        </div>
    </div>

    <!-- PANGGIL FILE SCRIPT (Menggunakan ?v=1.1 untuk mematikan cache HP otomatis saat update) -->
    <script src="app.js?v=1.2"></script>
</body>
</html>
